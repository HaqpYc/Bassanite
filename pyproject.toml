[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bassanite"
version = "0.1.0"
description = "A GPS receiver in Python, from raw HackRF samples to a position, with a web UI that explains each stage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]                 # the PNGs written by the command-line stages
ui = ["nicegui>=4.0,<5", "latex2mathml>=3.77"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools]
# Only the receiver package is installed. ui/ is an application run in place
# (python ui/app.py); the numbered stage folders hold scripts and notes.
packages = ["bassanite"]

[tool.pytest.ini_options]
# `python -m pytest` from the repo root runs the receiver's tests; the UI's tests
# have their own settings (ui/pytest.ini): `python -m pytest ui`.
testpaths = ["tests"]
